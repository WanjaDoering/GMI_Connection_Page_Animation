<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMI · Connection Page Header Lottie Embed</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  #lottie-container {
    width: 100%;
    height: 100vh;
  }
</style>
</head>
<body>

<div id="lottie-container" role="img" aria-label="Invoices flying from portal to integration"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script>
  // Desktop = horizontale Animation (links nach rechts)
  // Mobile  = vertikale Animation (oben nach unten) — Datei muss aus AE exportiert werden
  const DESKTOP_JSON = 'Connection%20Page%20Header%20Animation.json';
  const MOBILE_JSON  = 'Connection%20Page%20Header%20Animation_Mobile.json';

  const isMobile = window.matchMedia('(max-width: 768px)').matches;
  const primaryPath = isMobile ? MOBILE_JSON : DESKTOP_JSON;

  const container = document.getElementById('lottie-container');

  function loadLottie(path) {
    const anim = lottie.loadAnimation({
      container: container,
      renderer: 'svg',
      loop: true,
      autoplay: true,
      path: path,
      rendererSettings: {
        preserveAspectRatio: 'xMidYMid meet',
        progressiveLoad: true
      }
    });
    return anim;
  }

  const anim = loadLottie(primaryPath);

  // Fallback: wenn die Mobile-JSON noch nicht existiert (z.B. Build vor AE-Export),
  // lade stattdessen die Desktop-Version, damit nichts kaputt aussieht.
  anim.addEventListener('data_failed', () => {
    if (primaryPath === MOBILE_JSON) {
      console.warn('[lottie-embed] Mobile JSON not found — falling back to desktop animation.');
      container.innerHTML = '';
      loadLottie(DESKTOP_JSON);
    } else {
      console.error('[lottie-embed] Desktop JSON failed to load. Check path/CORS.');
    }
  });
</script>

</body>
</html>
