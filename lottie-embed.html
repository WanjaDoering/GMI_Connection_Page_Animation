<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMI · Connection Page Header Lottie Embed</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  #lottie-container {
    width: 100%;
    height: 100vh;
  }
</style>
</head>
<body>

<div id="lottie-container" role="img" aria-label="Invoices flying from portal to integration"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script>
  // Renames mit Leerzeichen brauchen URL-Encoding (%20)
  // Pfad relativ zur HTML-Datei — JSON liegt im gleichen Ordner
  lottie.loadAnimation({
    container: document.getElementById('lottie-container'),
    renderer: 'svg',
    loop: true,
    autoplay: true,
    path: 'Connection%20Page%20Header%20Animation.json',
    rendererSettings: {
      preserveAspectRatio: 'xMidYMid meet',
      progressiveLoad: true
    }
  });
</script>

</body>
</html>
