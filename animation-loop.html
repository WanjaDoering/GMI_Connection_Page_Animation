<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMI Invoice Flight Animation</title>
<style>
:root {
  --invoice-color: #44a4dc;
  --duration: 4.2s;
  --stagger: 0.7s;
  --invoice-w: 44px;
}
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  height: 100%;
  overflow: hidden;
  font-family: sans-serif;
}

.flight-zone {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
  -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
}

.invoice {
  position: absolute;
  top: 50%;
  left: -10%;
  width: var(--invoice-w);
  color: var(--invoice-color);
  animation: fly var(--duration) linear infinite;
  opacity: 0;
  filter: drop-shadow(0 2px 8px rgba(68,164,220,0.4));
  will-change: transform, left, opacity;
}
.invoice svg {
  display: block;
  width: 100%;
  height: auto;
  fill: currentColor;
}

.invoice:nth-child(1) { animation-delay: 0s;                       --y: -50%; --scale: 1.0;  }
.invoice:nth-child(2) { animation-delay: calc(var(--stagger) * 1); --y: -20%; --scale: 0.85; }
.invoice:nth-child(3) { animation-delay: calc(var(--stagger) * 2); --y: -65%; --scale: 1.15; }
.invoice:nth-child(4) { animation-delay: calc(var(--stagger) * 3); --y: -35%; --scale: 0.95; }
.invoice:nth-child(5) { animation-delay: calc(var(--stagger) * 4); --y: -55%; --scale: 1.10; }
.invoice:nth-child(6) { animation-delay: calc(var(--stagger) * 5); --y: -45%; --scale: 0.90; }

@keyframes fly {
  0%   { left: -10%; transform: translateY(var(--y)) rotate(-10deg) scale(var(--scale)); opacity: 0; }
  8%   { opacity: 0.9; }
  50%  { transform: translateY(calc(var(--y) - 10px)) rotate(4deg) scale(var(--scale)); }
  92%  { opacity: 0.9; }
  100% { left: 110%; transform: translateY(var(--y)) rotate(12deg) scale(var(--scale)); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .invoice { animation: none; opacity: 0.6; }
  .invoice:nth-child(1) { left: 15%; }
  .invoice:nth-child(2) { left: 30%; }
  .invoice:nth-child(3) { left: 45%; }
  .invoice:nth-child(4) { left: 60%; }
  .invoice:nth-child(5) { left: 75%; }
  .invoice:nth-child(6) { display: none; }
}
</style>
</head>
